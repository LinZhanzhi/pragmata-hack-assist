<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Path Solver</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Path Solver</h1>
    <p class="subtitle">A* with reward-collecting heuristic on a 2D grid</p>
  </header>

  <main>
    <section class="controls">
      <div class="control-group">
        <label>Rows <input id="rows" type="number" min="5" max="60" value="20" /></label>
        <label>Cols <input id="cols" type="number" min="5" max="60" value="20" /></label>
        <label>Reward % <input id="rewardPct" type="number" min="0" max="80" value="15" /></label>
        <label>Forbidden % <input id="forbiddenPct" type="number" min="0" max="60" value="20" /></label>
      </div>
      <div class="control-group">
        <label>α (reward weight) <input id="alpha" type="number" step="0.1" value="5" /></label>
        <label>β (path-cost weight) <input id="beta" type="number" step="0.1" value="1" /></label>
        <label>Max expansions <input id="maxExp" type="number" value="5000" /></label>
      </div>
      <div class="control-group buttons">
        <button id="generateBtn">Generate</button>
        <button id="solveBtn">Solve</button>
        <button id="clearBtn">Clear Path</button>
      </div>
    </section>

    <section class="results">
      <div>Status: <span id="status">idle</span></div>
      <div>Time: <span id="time">-</span> ms</div>
      <div>Steps: <span id="steps">-</span></div>
      <div>Rewards collected: <span id="rewards">-</span></div>
      <div>Expansions: <span id="expansions">-</span></div>
    </section>

    <section class="legend">
      <span class="swatch start"></span>Start
      <span class="swatch dest"></span>Destination
      <span class="swatch reward"></span>Reward
      <span class="swatch forbidden"></span>Forbidden
      <span class="swatch normal"></span>Normal
      <span class="swatch path"></span>Path
    </section>

    <section class="grid-wrapper">
      <div id="gridContainer">
        <div id="grid"></div>
        <svg id="pathOverlay"></svg>
      </div>
    </section>
  </main>

  <script src="solver.js"></script>
  <script src="app.js"></script>
</body>
</html>
